# epie-formation-hub/frontend/nginx.conf

server {
    listen 80; # Écoute sur le port 80 à l'intérieur du conteneur

    location / {
        root /usr/share/nginx/html; # Chemin où se trouvent tes fichiers frontend buildés
        index index.html index.htm; # Fichiers d'index par défaut
        try_files $uri $uri/ /index.html; # TRÈS IMPORTANT pour les SPAs
        # Cela signifie:
        # 1. Essaye de servir le fichier demandé ($uri)
        # 2. Si c'est un dossier, essaye de servir son index ($uri/)
        # 3. Sinon (si le fichier ou dossier n'existe pas), renvoie toujours index.html
    }

    # Optionnel: Configuration pour les fichiers API si le frontend et backend sont sur le même domaine
    # Si tes appels API sont vers un domaine différent (par exemple localhost:5000), ce n'est pas nécessaire.
    # Mais si tu voulais un proxy pour appeler l'API via le même Nginx (par exemple /api/employees)
    # location /api/ {
    #     proxy_pass http://backend:5000; # 'backend' est le nom de ton service backend dans docker-compose
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }
}